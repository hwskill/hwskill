name: Validate source and static site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install .
          npm ci --prefix site
      - name: Prepare generated directory data
        run: npm --prefix site run prebuild
      - name: Validate directory and tests
        run: |
          PYTHONPATH=src:. python -m unittest discover -s tests -t . -p 'test_*.py'
          node site/tests/highlight.test.mjs
          PYTHONPATH=src python -m hwskill.directory validate --repo-root . --json
      - name: Build and evaluate static site
        run: |
          npm --prefix site run build
          npm --prefix site run index
