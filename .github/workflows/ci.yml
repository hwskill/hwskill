name: Validate source and static site

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install 'setuptools>=68' wheel .
          npm ci --prefix site
      - name: Collect pull request changed paths
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_PATHS_FILE: ${{ runner.temp }}/hwskill-changed-paths.txt
        run: git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$CHANGED_PATHS_FILE"
      - name: Validate skill report in pull request body
        if: github.event_name == 'pull_request'
        env:
          CHANGED_PATHS_FILE: ${{ runner.temp }}/hwskill-changed-paths.txt
        run: python scripts/ci/validate_pr_report.py --changed-paths-file "$CHANGED_PATHS_FILE"
      - name: Prepare generated directory data
        run: npm --prefix site run prebuild
      - name: Run Python tests
        run: |
          if PYTHONPATH=src:. python -m unittest discover -s tests -t . -p 'test_*.py' > "$RUNNER_TEMP/hwskill-python-tests.log" 2>&1; then
            cat "$RUNNER_TEMP/hwskill-python-tests.log"
          else
            tail -n 80 "$RUNNER_TEMP/hwskill-python-tests.log"
            summary="$(tail -n 80 "$RUNNER_TEMP/hwskill-python-tests.log")"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            summary="${summary//$'\n'/'%0A'}"
            echo "::error title=Python test failure::$summary"
            exit 1
          fi
      - name: Run search highlight tests
        run: node site/tests/highlight.test.mjs
      - name: Validate directory
        run: PYTHONPATH=src python -m hwskill.directory validate --repo-root . --json
      - name: Build and evaluate static site
        run: |
          npm --prefix site run build
          npm --prefix site run index

  dispatch_pages:
    name: Dispatch Pages release
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out validated source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Dispatch current source commit
        env:
          PAGES_DISPATCH_TOKEN: ${{ secrets.PAGES_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/ci/dispatch_pages.py "$SOURCE_SHA"
