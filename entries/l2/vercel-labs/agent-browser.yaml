schema_version: 2
id: vercel-labs/agent-browser
name: agent-browser
summary: 面向 AI Agent 的浏览器自动化 CLI 技能入口，按已安装版本加载网页交互、数据提取和测试工作流。
layer: l2
purposes:
  - 网页导航、表单填写与按钮交互
  - 网页数据提取与截图
  - Web 应用探索性测试与质量检查
  - 按需加载 Electron、Slack 和云浏览器专项工作流
examples:
  - prompt: 使用 agent-browser 打开本地测试页面，填写姓名并提交表单，核对页面反馈后保存截图。
    expected_outcome: 先加载 core 工作流，使用独立浏览器会话获取快照和元素引用，填写并提交表单，再检查反馈文本并保存截图。
source:
  kind: external
  publicity: public
  locator:
    type: git
    repository: https://github.com/vercel-labs/agent-browser.git
    path: skills/agent-browser
install:
  method: upstream
  default_scope: project
  instructions_url: https://github.com/vercel-labs/agent-browser/blob/HEAD/README.md#usage-with-ai-agents
compatibility:
  agents: [codex, claude-code, cursor, gemini-cli, github-copilot, goose, opencode, windsurf]
  systems: [linux, macos, windows]
  requirements:
    - 安装 agent-browser CLI；通过 npm 安装时需要 Node.js，当前上游 package.json 声明 Node.js >=24。
    - 本地网页自动化需要 Chrome/Chromium；可由 agent-browser install 下载，Linux 还需要相应浏览器系统库。
    - 入口是发现用的引导文件；执行前须通过 agent-browser skills get core 加载与 CLI 配套的工作流，并保留包内 skill-data 材料。
    - Electron、Slack、Vercel Sandbox 和 AWS Bedrock AgentCore 任务须按需加载专项工作流，并具备对应应用、环境与访问权限。
license:
  status: known
  identifier: Apache-2.0
  url: https://github.com/vercel-labs/agent-browser/blob/HEAD/LICENSE
owner: Vercel Inc.
keywords: [browser, automation, CDP, Chrome, screenshot, Electron, Slack, QA]
limitations:
  - 仅复制入口文件不能替代 CLI 及其运行时工作流；具体命令和专项能力随已安装版本变化。
  - 上游列出的原生平台包括 macOS ARM64/x64、Linux ARM64/x64 和 Windows x64；其他架构需另行核对。
  - 本地浏览器需要系统依赖；云浏览器、登录站点与桌面应用需要对应凭据和授权，不能由技能入口自动提供。
  - 默认未命名会话会与其他 Agent 共享浏览器；core 工作流要求使用独立命名会话，并将网页和工具元数据视为不可信数据。
lifecycle: active
