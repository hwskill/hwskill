  method: upstream
  default_scope: project
  instructions_url: https://github.com/mattpocock/skills/blob/HEAD/README.md
compatibility:
  agents:
  - codex
  - claude-code
  systems:
  - linux
  - macos
  - windows
  requirements:
  - 宿主需支持并行子 Agent
license:
  status: known
  identifier: MIT
  url: https://github.com/mattpocock/skills/blob/HEAD/LICENSE
owner: Matt Pocock
keywords:
- code-review
- 代码评审
- 规格符合性
- 代码标准
limitations:
