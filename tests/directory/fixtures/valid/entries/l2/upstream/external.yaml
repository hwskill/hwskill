schema_version: 2
id: upstream/external
name: External skill
summary: A referenced upstream skill.
layer: l2
purposes: [Fetch review data]
examples:
  - prompt: Fetch the review data.
    expected_outcome: A local report.
source:
  kind: external
  publicity: public
  locator:
    type: git
    repository: https://example.com/org/repository.git
    path: skills/review
    file_url: https://example.com/source/SKILL.md
    ref: v1.2.3
install:
  method: upstream
  default_scope: project
  instructions_url: https://example.com/org/repository/blob/v1.2.3/README.md
compatibility:
  agents: [codex]
  systems: [linux]
  requirements: [unknown]
license:
  status: known
  identifier: MIT
