schema_version: 1
target:
  kind: profile
  id: codex-demo

cases:
  - id: repair-inclusive-discount-boundary
    description: The codex-demo Skill set diagnoses and repairs the inclusive discount threshold defect.
    prepare:
      type: command
      command: PYTHONPATH="$HWSKILL_TEST_PYTHONPATH" "$HWSKILL_TEST_PYTHON" -m hwskill profile bind codex-demo --project . --repo-root "$HWSKILL_TEST_REPO_ROOT" --yes
    steps:
      - id: run-agent
        type: agent
        prompt: 订单折扣在阈值边界失败。请先使用 hwskill_search 查询 systematic debugging，再仅用 hwskill_load 加载 superpowers/systematic-debugging；系统化定位并修复问题，然后运行现有测试。
      - id: run-business-tests
        type: command
        command: python3 -m unittest discover -s tests -t . -v
    post_check:
      type: command
      command: exec "$HWSKILL_TEST_PYTHON" "$HWSKILL_TEST_REPO_ROOT/tests/profiles/codex-demo/scripts/post_check.py"
